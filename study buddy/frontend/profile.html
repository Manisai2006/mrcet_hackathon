<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Settings - AI Personal Tutor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- App Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3 border-bottom border-secondary border-opacity-25">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="dashboard.html">
                <i class="fa-solid fa-graduation-cap text-primary"></i>
                <span>Study<span class="gradient-text">Buddy AI</span></span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <a href="dashboard.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                    <i class="fa-solid fa-house me-1"></i> Dashboard
                </a>
                <button onclick="API.logout()" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                    <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Profile Settings Page Content -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="glass-card p-4 p-md-5">
                    <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom border-secondary border-opacity-25">
                        <div class="bg-primary bg-opacity-25 text-primary p-3 rounded-circle fs-3">
                            <i class="fa-solid fa-id-card"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold mb-0">Student Profile & Settings</h3>
                            <p class="text-secondary small mb-0">Manage your learning preferences, class, and tutor language.</p>
                        </div>
                    </div>

                    <form id="profileForm">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="name" class="form-label text-secondary">Student Name</label>
                                <input type="text" class="form-control" id="name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label text-secondary">Email Address (Read-only)</label>
                                <input type="email" class="form-control text-muted" id="email" disabled readonly>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="student_class" class="form-label text-secondary">School Class / Grade</label>
                                <select class="form-select" id="student_class" required>
                                    <option value="1st">Class 1</option>
                                    <option value="2nd">Class 2</option>
                                    <option value="3rd">Class 3</option>
                                    <option value="4th">Class 4</option>
                                    <option value="5th">Class 5</option>
                                    <option value="6th">Class 6</option>
                                    <option value="7th">Class 7</option>
                                    <option value="8th">Class 8</option>
                                    <option value="9th">Class 9</option>
                                    <option value="10th">Class 10</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="preferred_language" class="form-label text-secondary">Preferred Language</label>
                                <select class="form-select" id="preferred_language" required>
                                    <option value="English">English</option>
                                    <option value="Telugu">Telugu (తెలుగు)</option>
                                    <option value="Hindi">Hindi (हिंदी)</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="preferred_subjects" class="form-label text-secondary">Preferred Subjects</label>
                            <input type="text" class="form-control" id="preferred_subjects" placeholder="Mathematics, Physics, Chemistry, Biology, Social Studies, Reasoning">
                        </div>

                        <div class="mb-4">
                            <label for="learning_level" class="form-label text-secondary">Learning Level</label>
                            <select class="form-select" id="learning_level">
                                <option value="Beginner">Beginner (Step-by-step simple explanations)</option>
                                <option value="Intermediate">Intermediate (Balanced practice & detail)</option>
                                <option value="Advanced">Advanced (Challenging concepts & depth)</option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-end gap-3 pt-3 border-top border-secondary border-opacity-25">
                            <a href="dashboard.html" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary-gradient px-4">Save Profile Settings</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
