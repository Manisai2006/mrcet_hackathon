<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor Chat - StudyBuddy AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>
    <!-- App Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-2 border-bottom border-secondary border-opacity-25">
        <div class="container-fluid px-4">
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-outline-secondary btn-sm d-md-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="dashboard.html">
                    <i class="fa-solid fa-graduation-cap text-primary"></i>
                    <span>Study<span class="gradient-text">Buddy AI</span></span>
                </a>
            </div>

            <div class="d-flex align-items-center gap-2">
                <a href="dashboard.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                    <i class="fa-solid fa-house me-1"></i> Dashboard
                </a>
                <button id="btnNewChat" class="btn btn-primary-gradient btn-sm rounded-pill px-3">
                    <i class="fa-solid fa-plus me-1"></i> New Chat
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Chat Workspace -->
    <div class="chat-container">
        <!-- Desktop Sidebar History -->
        <aside class="chat-sidebar d-none d-md-flex">
            <div class="p-3 border-bottom border-secondary border-opacity-25 d-flex justify-content-between align-items-center">
                <span class="fw-bold text-secondary small text-uppercase tracking-wider"><i class="fa-solid fa-clock-rotate-left me-2"></i>History</span>
                <a href="history.html" class="text-info small text-decoration-none">Manage</a>
            </div>
            <div class="history-list" id="sidebarHistoryList">
                <!-- Dynamically populated -->
            </div>
        </aside>

        <!-- Mobile Offcanvas Sidebar -->
        <div class="offcanvas offcanvas-start bg-dark text-light" tabindex="-1" id="sidebarOffcanvas">
            <div class="offcanvas-header border-bottom border-secondary border-opacity-25">
                <h5 class="offcanvas-title fw-bold"><i class="fa-solid fa-clock-rotate-left me-2 text-primary"></i>Chat History</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body p-2" id="mobileSidebarHistoryList">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <!-- Header Controls Bar -->
            <div class="chat-header">
                <div class="d-flex align-items-center gap-2">
                    <h5 class="fw-bold mb-0 text-truncate" id="chatTitle" style="max-width: 300px;">New Doubt Session</h5>
                    <span class="badge bg-primary bg-opacity-25 text-info border border-info border-opacity-25" id="activeModeBadge">Teach Me</span>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <!-- Auto-Speak Toggle -->
                    <div class="form-check form-switch mb-0 d-none d-sm-flex align-items-center gap-1 text-secondary small">
                        <input class="form-check-input" type="checkbox" id="autoSpeakToggle">
                        <label class="form-check-label" for="autoSpeakToggle"><i class="fa-solid fa-volume-high me-1"></i>Auto-Speak</label>
                    </div>

                    <!-- Tutor Mode Selector -->
                    <select class="form-select form-select-sm" id="tutorModeSelect" style="width: auto;">
                        <option value="Teach Me">🎓 Teach Me (Socratic Step-by-Step)</option>
                        <option value="Quick Explanation">⚡ Quick Explanation</option>
                        <option value="Practice Me">📝 Practice Me</option>
                    </select>

                    <!-- Language Selector -->
                    <select class="form-select form-select-sm" id="languageSelect" style="width: auto;">
                        <option value="English">🇬🇧 English</option>
                        <option value="Telugu">తెలుగు (Telugu)</option>
                        <option value="Hindi">हिंदी (Hindi)</option>
                    </select>

                    <!-- Knowledge Source & RAG Mode Selector -->
                    <select class="form-select form-select-sm" id="documentSelect" style="width: auto;">
                        <option value="">🌐 General AI Knowledge</option>
                        <option value="STRICT_ALL">📄 Strict PDF Mode (All Notes)</option>
                    </select>
                </div>
            </div>

            <!-- Messages Stream Area -->
            <div class="chat-messages" id="chatMessages">
                <!-- Welcome Empty State -->
                <div class="text-center my-auto py-5" id="emptyChatState">
                    <div class="fs-1 text-primary mb-3"><i class="fa-solid fa-robot"></i></div>
                    <h3 class="fw-bold mb-2">Hello! I am your AI Tutor.</h3>
                    <p class="text-secondary max-w-lg mx-auto mb-4">
                        Ask any school doubt in <strong>Telugu</strong>, <strong>Hindi</strong>, or <strong>English</strong>. I will guide you step-by-step to help you truly understand!
                    </p>
                    <div class="d-flex justify-content-center gap-2 flex-wrap">
                        <button class="btn btn-outline-secondary btn-sm rounded-pill sample-prompt" data-prompt="Explain Newton's third law with a simple example">
                            "Explain Newton's third law"
                        </button>
                        <button class="btn btn-outline-secondary btn-sm rounded-pill sample-prompt" data-prompt="Photosynthesis ante enti? Simple ga cheppu">
                            "Photosynthesis ante enti?"
                        </button>
                        <button class="btn btn-outline-secondary btn-sm rounded-pill sample-prompt" data-prompt="Solve 2x + 5 = 15 step by step">
                            "Solve 2x + 5 = 15"
                        </button>
                    </div>
                </div>
            </div>

            <!-- Message Composer Form -->
            <div class="chat-composer">
                <form id="chatForm">
                    <div class="composer-input-group">
                        <button type="button" class="btn btn-mic" id="micBtn" title="Voice Input">
                            <i class="fa-solid fa-microphone"></i>
                        </button>

                        <input type="text" class="form-control composer-input" id="chatInput" placeholder="Ask any doubt in English, Telugu, or Hindi..." required autocomplete="off">

                        <button type="submit" class="btn btn-primary-gradient rounded-pill px-4" id="sendBtn">
                            <span>Send</span> <i class="fa-solid fa-paper-plane ms-1"></i>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/voice.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
