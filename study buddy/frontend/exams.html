<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Exam Generator - StudyBuddy AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/exam.css">
</head>
<body>
    <!-- App Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3 border-bottom border-secondary border-opacity-25">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="dashboard.html">
                <i class="fa-solid fa-graduation-cap text-primary"></i>
                <span>Study<span class="gradient-text">Buddy AI</span></span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <a href="dashboard.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                    <i class="fa-solid fa-house me-1"></i> Dashboard
                </a>
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h3 class="fw-bold mb-1"><i class="fa-solid fa-file-signature text-warning me-2"></i>AI Mock Exam Generator</h3>
                <p class="text-secondary small mb-0">Generate personalized practice exams in English, Telugu, or Hindi.</p>
            </div>
            <button class="btn btn-primary-gradient rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#generateExamModal">
                <i class="fa-solid fa-wand-magic-sparkles me-2"></i>Generate New Exam
            </button>
        </div>

        <!-- Available Exams List -->
        <div class="row g-4" id="examsListGrid">
            <!-- Dynamically populated -->
        </div>
    </div>

    <!-- Generate Exam Modal -->
    <div class="modal fade" id="generateExamModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content glass-card text-light border-secondary border-opacity-25">
                <div class="modal-header border-bottom border-secondary border-opacity-25">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-sliders text-warning me-2"></i>Configure AI Exam</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="generateExamForm">
                    <div class="modal-body">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="examSubject" class="form-label text-secondary">Subject</label>
                                <select class="form-select" id="examSubject" required>
                                    <option value="Physics">Physics</option>
                                    <option value="Chemistry">Chemistry</option>
                                    <option value="Biology">Biology</option>
                                    <option value="Mathematics">Mathematics</option>
                                    <option value="Social Studies">Social Studies</option>
                                    <option value="Reasoning">Reasoning</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="examLanguage" class="form-label text-secondary">Language</label>
                                <select class="form-select" id="examLanguage" required>
                                    <option value="English">English</option>
                                    <option value="Telugu">Telugu (తెలుగు)</option>
                                    <option value="Hindi">Hindi (हिंदी)</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="examDifficulty" class="form-label text-secondary">Difficulty Level</label>
                                <select class="form-select" id="examDifficulty" required>
                                    <option value="Easy">Easy (Fundamental concepts)</option>
                                    <option value="Medium" selected>Medium (Standard school exam level)</option>
                                    <option value="Hard">Hard (Advanced problem solving)</option>
                                    <option value="Mixed">Mixed (All difficulty levels)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="questionTypes" class="form-label text-secondary">Question Types</label>
                                <select class="form-select" id="questionTypes" required>
                                    <option value="MCQ" selected>Multiple Choice (MCQ)</option>
                                    <option value="True/False">True / False</option>
                                    <option value="Short Answer">Short Answer</option>
                                    <option value="Mixed">Mixed Types</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="totalQuestions" class="form-label text-secondary">Number of Questions</label>
                                <select class="form-select" id="totalQuestions" required>
                                    <option value="5" selected>5 Questions</option>
                                    <option value="10">10 Questions</option>
                                    <option value="15">15 Questions</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="timeLimit" class="form-label text-secondary">Timer</label>
                                <select class="form-select" id="timeLimit" required>
                                    <option value="0" selected>Untimed Practice</option>
                                    <option value="10">10 Minutes</option>
                                    <option value="20">20 Minutes</option>
                                    <option value="30">30 Minutes</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="examDocSelect" class="form-label text-secondary">Base Exam on Uploaded PDF (Optional)</label>
                            <select class="form-select" id="examDocSelect">
                                <option value="">🌐 General Syllabus Knowledge</option>
                            </select>
                        </div>
                    </div>

                    <div class="modal-footer border-top border-secondary border-opacity-25">
                        <button type="button" class="btn btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary-gradient px-4" id="btnSubmitGenerate">
                            Generate Exam <i class="fa-solid fa-sparkles ms-1"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/exams.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadExamsList();
            loadDocumentOptions();
        });

        async function loadExamsList() {
            const grid = document.getElementById('examsListGrid');
            try {
                const exams = await API.request('/exams');
                if (!exams || exams.length === 0) {
                    grid.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="fa-solid fa-file-signature fs-1 text-secondary opacity-50 mb-3"></i>
                            <h5 class="fw-bold">No exams created yet</h5>
                            <p class="text-secondary small">Generate your first AI mock test to practice!</p>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = exams.map(e => `
                    <div class="col-md-6 col-lg-4">
                        <div class="glass-card p-4 h-100 d-flex flex-column justify-content-between">
                            <div>
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <span class="badge bg-warning bg-opacity-25 text-warning border border-warning border-opacity-25">${e.subject}</span>
                                    <span class="badge bg-primary bg-opacity-25 text-info">${e.language}</span>
                                </div>
                                <h5 class="fw-bold mb-2 text-truncate">${e.title}</h5>
                                <div class="text-secondary small mb-3">
                                    <div><i class="fa-solid fa-list-check me-2 text-primary"></i>${e.total_questions} Questions • ${e.difficulty}</div>
                                    <div><i class="fa-solid fa-stopwatch me-2 text-warning"></i>${e.time_limit_minutes > 0 ? e.time_limit_minutes + ' Mins' : 'Untimed'}</div>
                                </div>
                            </div>
                            <div class="pt-3 border-top border-secondary border-opacity-25">
                                <a href="exam.html?id=${e.id}" class="btn btn-primary-gradient w-100">
                                    Start Test <i class="fa-solid fa-play ms-1"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                grid.innerHTML = `<div class="col-12 text-danger">Failed to load exams list.</div>`;
            }
        }

        async function loadDocumentOptions() {
            try {
                const docs = await API.request('/documents');
                const select = document.getElementById('examDocSelect');
                if (docs && docs.length > 0) {
                    docs.forEach(d => {
                        select.innerHTML += `<option value="${d.id}">📄 ${d.filename}</option>`;
                    });
                }
            } catch(e) {}
        }
    </script>
</body>
</html>
