<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - AI Personal Tutor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="index.html">
                <i class="fa-solid fa-graduation-cap text-primary"></i>
                <span>Study<span class="gradient-text">Buddy AI</span></span>
            </a>
        </div>
    </nav>

    <!-- Register Auth Container -->
    <div class="auth-wrapper">
        <div class="glass-card auth-card" style="max-width: 520px;">
            <div class="auth-header">
                <div class="fs-1 text-info"><i class="fa-solid fa-user-plus"></i></div>
                <h3 class="fw-bold mb-1">Create Student Profile</h3>
                <p class="text-secondary small">Set up your personalized AI tutor account in seconds.</p>
            </div>

            <form id="registerForm">
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" placeholder="e.g. Abhinav Reddy" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="student@school.edu" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="At least 6 characters" minlength="6" required>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="student_class" class="form-label">School Class / Grade</label>
                        <select class="form-select" id="student_class" required>
                            <option value="1st">Class 1</option>
                            <option value="2nd">Class 2</option>
                            <option value="3rd">Class 3</option>
                            <option value="4th">Class 4</option>
                            <option value="5th">Class 5</option>
                            <option value="6th">Class 6</option>
                            <option value="7th">Class 7</option>
                            <option value="8th">Class 8</option>
                            <option value="9th">Class 9</option>
                            <option value="10th" selected>Class 10</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="preferred_language" class="form-label">Preferred Language</label>
                        <select class="form-select" id="preferred_language" required>
                            <option value="English">English</option>
                            <option value="Telugu">Telugu (తెలుగు)</option>
                            <option value="Hindi">Hindi (हिंदी)</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-gradient w-100 mb-3">
                    Create Account <i class="fa-solid fa-user-plus ms-2"></i>
                </button>

                <div class="text-center text-secondary small">
                    Already have an account? <a href="login.html" class="text-info fw-medium text-decoration-none">Login here</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
