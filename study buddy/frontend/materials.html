<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Study Materials (PDF RAG) - StudyBuddy AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- App Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3 border-bottom border-secondary border-opacity-25">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="dashboard.html">
                <i class="fa-solid fa-graduation-cap text-primary"></i>
                <span>Study<span class="gradient-text">Buddy AI</span></span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <a href="chat.html" class="btn btn-primary-gradient btn-sm rounded-pill px-3">
                    <i class="fa-solid fa-comments me-1"></i> Ask AI Tutor
                </a>
                <a href="dashboard.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                    <i class="fa-solid fa-house me-1"></i> Dashboard
                </a>
            </div>
        </div>
    </nav>

    <!-- Page Header & Upload Card -->
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h3 class="fw-bold mb-1"><i class="fa-solid fa-file-pdf text-danger me-2"></i>My PDF Study Materials</h3>
                <p class="text-secondary small mb-0">Upload school textbooks and revision notes to create your personal AI knowledge base.</p>
            </div>
            <button class="btn btn-primary-gradient rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#uploadModal">
                <i class="fa-solid fa-cloud-arrow-up me-2"></i>Upload PDF Material
            </button>
        </div>

        <!-- Upload Status Progress Banner (Hidden by default) -->
        <div id="uploadStatusBanner" class="alert alert-info border border-info border-opacity-25 bg-dark text-info p-3 mb-4 d-none">
            <div class="d-flex align-items-center gap-3">
                <div class="spinner-border spinner-border-sm text-info" id="uploadSpinner"></div>
                <div>
                    <strong id="uploadStatusTitle">Uploading PDF...</strong>
                    <div class="small text-secondary" id="uploadStatusSubtitle">Extracting text & creating knowledge base...</div>
                </div>
            </div>
        </div>

        <!-- Documents Grid -->
        <div class="row g-4" id="documentsGrid">
            <!-- Dynamically populated -->
        </div>
    </div>

    <!-- Upload PDF Modal -->
    <div class="modal fade" id="uploadModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card text-light border-secondary border-opacity-25">
                <div class="modal-header border-bottom border-secondary border-opacity-25">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-file-arrow-up text-primary me-2"></i>Upload PDF Textbook / Notes</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="uploadDocForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="pdfFile" class="form-label text-secondary">Select PDF File (Max 20MB)</label>
                            <input type="file" class="form-control" id="pdfFile" accept=".pdf,application/pdf" required>
                        </div>
                        <div class="mb-3">
                            <label for="docSubject" class="form-label text-secondary">Subject / Category</label>
                            <select class="form-select" id="docSubject">
                                <option value="Physics">Physics</option>
                                <option value="Chemistry">Chemistry</option>
                                <option value="Biology">Biology</option>
                                <option value="Mathematics">Mathematics</option>
                                <option value="Social Studies">Social Studies</option>
                                <option value="Reasoning">Reasoning</option>
                                <option value="General Science" selected>General Science</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer border-top border-secondary border-opacity-25">
                        <button type="button" class="btn btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary-gradient px-4" id="btnSubmitUpload">
                            Upload & Extract <i class="fa-solid fa-arrow-up-from-bracket ms-1"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Document Info Modal -->
    <div class="modal fade" id="infoModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card text-light border-secondary border-opacity-25">
                <div class="modal-header border-bottom border-secondary border-opacity-25">
                    <h5 class="modal-title fw-bold" id="infoModalTitle">Document Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="infoModalBody">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/documents.js"></script>
</body>
</html>
