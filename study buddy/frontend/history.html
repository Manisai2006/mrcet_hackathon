<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat History - StudyBuddy AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- App Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3 border-bottom border-secondary border-opacity-25">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="dashboard.html">
                <i class="fa-solid fa-graduation-cap text-primary"></i>
                <span>Study<span class="gradient-text">Buddy AI</span></span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <a href="chat.html" class="btn btn-primary-gradient btn-sm rounded-pill px-3">
                    <i class="fa-solid fa-plus me-1"></i> New Chat
                </a>
                <a href="dashboard.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                    <i class="fa-solid fa-house me-1"></i> Dashboard
                </a>
            </div>
        </div>
    </nav>

    <!-- History Manager Content -->
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1"><i class="fa-solid fa-clock-rotate-left text-primary me-2"></i>Tutoring Session History</h3>
                <p class="text-secondary small mb-0">Search, review, or continue your previous learning sessions.</p>
            </div>
            <input type="text" class="form-control form-control-sm w-auto" id="searchHistory" placeholder="Search conversations...">
        </div>

        <div class="row g-3" id="historyCardGrid">
            <!-- Dynamically populated -->
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            loadHistoryGrid();
            document.getElementById('searchHistory').addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                const cards = document.querySelectorAll('.history-card');
                cards.forEach(card => {
                    const title = card.getAttribute('data-title').toLowerCase();
                    card.style.display = title.includes(query) ? 'block' : 'none';
                });
            });
        });

        async function loadHistoryGrid() {
            const grid = document.getElementById('historyCardGrid');
            try {
                const conversations = await API.request('/chat/history');
                if (!conversations || conversations.length === 0) {
                    grid.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="fa-solid fa-folder-open fs-1 text-secondary opacity-50 mb-3"></i>
                            <h5 class="fw-bold">No chat history yet</h5>
                            <p class="text-secondary small">Start your first tutoring session now!</p>
                            <a href="chat.html" class="btn btn-primary-gradient rounded-pill px-4 mt-2">Start Learning</a>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = conversations.map(c => `
                    <div class="col-md-6 col-lg-4 history-card" data-title="${c.title}">
                        <div class="glass-card p-4 h-100 d-flex flex-column justify-content-between">
                            <div>
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <span class="badge bg-primary bg-opacity-25 text-info border border-info border-opacity-25">${c.selected_language}</span>
                                    <span class="badge bg-secondary bg-opacity-25 text-secondary">${c.tutor_mode}</span>
                                </div>
                                <h5 class="fw-bold mb-2 text-truncate">${c.title}</h5>
                                <p class="text-secondary small mb-3">Updated: ${new Date(c.updated_at).toLocaleDateString()}</p>
                            </div>
                            <div class="d-flex gap-2 pt-3 border-top border-secondary border-opacity-25">
                                <a href="chat.html?id=${c.id}" class="btn btn-primary-gradient btn-sm flex-grow-1">Continue Chat <i class="fa-solid fa-arrow-right ms-1"></i></a>
                                <button onclick="deleteConv(${c.id})" class="btn btn-outline-danger btn-sm" title="Delete"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                grid.innerHTML = `<div class="col-12 text-danger">Failed to load conversation history.</div>`;
            }
        }

        async function deleteConv(id) {
            if (confirm('Are you sure you want to delete this conversation history?')) {
                try {
                    await API.request(`/chat/${id}`, { method: 'DELETE' });
                    showToast('Conversation deleted', 'success');
                    loadHistoryGrid();
                } catch (e) {
                    showToast('Failed to delete conversation', 'error');
                }
            }
        }
    </script>
</body>
</html>
