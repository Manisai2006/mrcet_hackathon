<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take AI Exam - StudyBuddy AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/exam.css">
</head>
<body>
    <!-- Fixed Exam Header -->
    <header class="exam-header sticky-top">
        <div class="container d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <a href="exams.html" class="btn btn-outline-secondary btn-sm rounded-circle"><i class="fa-solid fa-arrow-left"></i></a>
                <div>
                    <h5 class="fw-bold mb-0 text-truncate" id="examTitle" style="max-width: 350px;">Physics Mock Test</h5>
                    <span class="badge bg-primary bg-opacity-25 text-info" id="examMetaBadge">Question 1 of 5</span>
                </div>
            </div>

            <!-- Countdown Timer -->
            <div id="timerContainer" class="d-none">
                <div class="timer-badge">
                    <i class="fa-solid fa-clock"></i>
                    <span id="timerText">00:00</span>
                </div>
            </div>

            <button type="button" class="btn btn-primary-gradient px-4" id="btnSubmitExamTop" onclick="confirmSubmitExam()">
                Submit Exam <i class="fa-solid fa-paper-plane ms-1"></i>
            </button>
        </div>
    </header>

    <!-- Exam Workspace -->
    <main class="container py-4">
        <div class="row g-4">
            <!-- Question Viewport -->
            <div class="col-lg-8">
                <div class="question-card mb-4" id="questionContainer">
                    <!-- Dynamically populated question card -->
                </div>

                <!-- Navigation Controls -->
                <div class="d-flex justify-content-between align-items-center">
                    <button class="btn btn-outline-secondary rounded-pill px-4" id="btnPrev" onclick="navigateQuestion(-1)" disabled>
                        <i class="fa-solid fa-chevron-left me-1"></i> Previous
                    </button>

                    <button class="btn btn-primary-gradient rounded-pill px-4" id="btnNext" onclick="navigateQuestion(1)">
                        Next <i class="fa-solid fa-chevron-right ms-1"></i>
                    </button>
                </div>
            </div>

            <!-- Side Question Palette Navigator -->
            <div class="col-lg-4">
                <div class="glass-card p-4">
                    <h6 class="fw-bold mb-3"><i class="fa-solid fa-grid-2 me-2 text-primary"></i>Question Navigator</h6>
                    <div class="question-nav-grid mb-4" id="questionNavGrid">
                        <!-- Dynamically populated 1 2 3... -->
                    </div>

                    <div class="d-flex align-items-center justify-content-between text-secondary small pt-3 border-top border-secondary border-opacity-25">
                        <div><i class="fa-solid fa-circle text-success me-1"></i>Answered</div>
                        <div><i class="fa-solid fa-circle text-primary me-1"></i>Current</div>
                        <div><i class="fa-solid fa-circle text-secondary me-1"></i>Unanswered</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/exams.js"></script>
</body>
</html>
